name: Compilar ALEXLANDS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ALEXLANDS-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generar IPA sin firmar
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Mostrar versión de Xcode
        run: xcodebuild -version

      - name: Compilar y verificar ALEXLANDS
        id: ipa
        shell: bash
        run: bash scripts/build_release.sh 2>&1 | tee "$RUNNER_TEMP/ALEXLANDS-build.log"

      - name: Publicar IPA para GBox
        uses: actions/upload-artifact@v4
        with:
          name: ALEXLANDS-${{ steps.ipa.outputs.version }}-${{ steps.ipa.outputs.build_number }}
          path: ${{ steps.ipa.outputs.ipa_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Guardar registro si falla la compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ALEXLANDS-error-de-compilacion
          path: ${{ runner.temp }}/ALEXLANDS-build.log
          if-no-files-found: ignore
          retention-days: 7

